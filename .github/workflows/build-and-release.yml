name: Build and Release alterOs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build WSL Distribution
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build alterOs distribution
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/alteros-kali-amd64-wsl.tar.gz

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: alteros-wsl-distribution
          path: dist/alteros-kali-amd64-wsl.tar.gz
          retention-days: 30

      - name: Test distribution (basic validation)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: |
          chmod +x scripts/test-wsl.sh
          # We can't run full WSL test in CI, but we can verify the tarball structure
          tar -tzf dist/alteros-kali-amd64-wsl.tar.gz | head -20
          echo "Build artifact verified"

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: alteros-wsl-distribution
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: alterOs ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## alterOs WSL2 Distribution
            
            Pre-built Kali Linux + Development Environment for WSL2.
            
            ### Installation
            ```powershell
            wsl --import alterOs <install-path> alteros-kali-amd64-wsl.tar.gz --version 2
            ```
            
            ### What's Included
            - **Kali Tools**: kali-linux-default + all tool categories (web, wireless, exploitation, forensics, etc.)
            - **Development**: Python, Node.js, Go, Rust, Java 21, .NET 8, Docker, Kubernetes
            - **Shell**: Zsh + Oh-My-Zsh, Starship prompt, Neovim, tmux
            - **WSL Integration**: systemd enabled, Windows path interop
            
            ### Verification
            Run `./scripts/test-wsl.sh` after installation to verify all tools.
          files: dist/alteros-kali-amd64-wsl.tar.gz
          draft: false
          prerelease: false
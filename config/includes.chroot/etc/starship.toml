# Starship configuration for alterOs
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$go\
$docker_context\
$kubernetes\
$line_break\
$character"""

[username]
show_always = true
format = "[$user]($style) "
style_user = "bold green"
style_root = "bold red"

[hostname]
ssh_only = false
format = "[$hostname]($style) "
style = "bold blue"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "🌱 "

[git_status]
conflicted = "⚔️ "
ahead = "⬆️ "
behind = "⬇️ "
diverged = "⬍ "
untracked = "❓ "
stashed = "📦 "
modified = "📝 "
staged = "➕ "
renamed = "📛 "
deleted = "🗑️ "

[python]
symbol = "🐍 "

[nodejs]
symbol = "📦 "

[rust]
symbol = "🦀 "

[go]
symbol = "🐹 "

[docker_context]
symbol = "🐳 "

[kubernetes]
symbol = "☸️ "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"